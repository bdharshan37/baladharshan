<!doctype html><html><head><meta charset="utf-8"><title>Project cards</title>
<style>
/* One 1200x860 card per project (exported at 2x): a calm coloured field and real screens, no text.
   Every screenshot is shown at no more than ~1.3x its pixel size at 2x, so nothing is upscaled into blur. */
*{box-sizing:border-box;margin:0}html,body{background:#fff}
.c{display:none;width:1200px;height:860px;position:relative;overflow:hidden}.c:target{display:block}
.s{position:absolute;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 36px 80px rgba(20,30,50,.2),0 0 0 1px rgba(0,0,0,.06)}
.s img{display:block;width:100%;height:100%}
.p{border-radius:34px}
</style></head><body>
<!-- Workflows: the builder, and the full run-history screen (uncropped) -->
<section class="c" id="workflows" style="background:linear-gradient(135deg,#CBE6E0,#E6F4F1)">
  <div class="s" style="left:60px;top:96px;width:880px;height:571px"><img src="../img/jc-flows.jpg"></div>
  <div class="s" style="right:56px;bottom:64px;width:640px;height:436px"><img src="../img/wf-history.jpg"></div>
</section>
<section class="c" id="slack" style="background:linear-gradient(135deg,#E8D8EC,#F4EBF6)">
  <div class="s" style="left:56px;top:84px;width:980px;height:666px;background:transparent;box-shadow:none"><img src="../img/sl-ar-1.png" style="filter:drop-shadow(0 34px 60px rgba(60,20,70,.3))"></div>
  <div class="s" style="right:40px;bottom:36px;width:640px;height:435px;background:transparent;box-shadow:none"><img src="../img/sl-alerts.png" style="filter:drop-shadow(0 26px 44px rgba(60,20,70,.32))"></div>
</section>

</section>

</body></html>
