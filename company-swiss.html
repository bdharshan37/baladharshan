<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baladharshan — Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
:root{--bg:#FFFFFF;--fg:#0B0B0B;--muted:#737373;--line:#E4E4E4;--accent:#FF3B1F;--accent-ink:#fff;--ui:'Inter',system-ui,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,monospace;--wipe-bg:#FF3B1F;--wipe-fg:#fff;--wipe-font:400 clamp(40px,9vw,120px)/1 'Inter',sans-serif}
::selection{background:var(--accent);color:#fff}
body{overflow-x:hidden}
@media(hover:hover){body,a,button,input{cursor:none}}
#cur-dot{position:fixed;left:0;top:0;width:10px;height:10px;border-radius:50%;background:var(--accent);pointer-events:none;z-index:60;transition:width .2s,height .2s,opacity .2s;margin:-5px 0 0 -5px}
#cur-dot.big{width:56px;height:56px;margin:-28px 0 0 -28px;opacity:.9}
@media(hover:none){#cur-dot{display:none}}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:20;background:var(--bg)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:14px}
.top .l{display:flex;align-items:center}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:10px}
.top a:hover{color:var(--accent)}.top .r{color:var(--muted);font-size:13px}
.hero{padding:64px 0 0}
.eyebrow{font-size:14px;color:var(--muted);margin-bottom:20px}.eyebrow b{font-weight:400;color:var(--fg)}
.ln{display:block;overflow:hidden;padding-bottom:.06em}
.ln>span{display:block;transform:translateY(105%);animation:up .95s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:.25s}
@keyframes up{to{transform:none}}
@media (prefers-reduced-motion:reduce){.ln>span{animation:none;transform:none}}
h1{font-weight:400;font-size:clamp(40px,7vw,84px);line-height:1;letter-spacing:-.045em}
.sum{margin-top:28px;max-width:56ch;font-size:clamp(17px,1.8vw,20px);line-height:1.55;letter-spacing:-.01em;color:var(--muted)}
.grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px 32px;padding-top:20px;margin-top:96px}
.grid>.lab{font-size:13px;color:var(--muted);position:sticky;top:76px;align-self:start}.lab i{font-style:normal;font-family:var(--mono);margin-right:10px;color:var(--fg)}
@media(max-width:720px){.grid{grid-template-columns:minmax(0,1fr)}.grid>.lab{position:static}}
.ims{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.im{background:var(--bg);padding:22px 20px 24px;display:flex;flex-direction:column;gap:10px;transition:background .25s}
.im:hover{background:#FAFAFA}
.im b{font-weight:400;font-size:clamp(30px,3.6vw,42px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.im span{font-size:14px;color:var(--muted);line-height:1.5}.im em{font-style:normal;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:4px;color:var(--fg)}
.did{list-style:none}.did li{display:grid;grid-template-columns:40px 1fr;padding:16px 0;border-bottom:1px solid var(--line);font-size:16px;letter-spacing:-.005em;line-height:1.55}
.did li:first-child{padding-top:0}.did li i{font:12px var(--mono);font-style:normal;color:var(--accent);padding-top:4px}
.sel{margin-top:120px}
.sel-h{font-size:13px;color:var(--muted);padding-top:0;margin-bottom:8px}
.fr{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);gap:56px;align-items:center;padding:56px 0;border-top:1px solid var(--line)}
.fr .t small{display:block;font-size:13px;color:var(--muted);margin-bottom:14px}
.fr .t h3{font-weight:500;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.045em;line-height:1.05}
.fr .t p{font-size:16px;line-height:1.6;color:var(--muted);margin-top:16px;max-width:36ch}
.fr .t .m{margin-top:22px;font-size:14px;line-height:1.4}.fr .t .m b{display:block;font-weight:500;font-size:26px;letter-spacing:-.04em;color:var(--accent);margin-bottom:2px}
.fr .t .go{display:inline-flex;align-items:center;gap:8px;margin-top:26px;background:var(--fg);color:#fff;font-size:14px;padding:11px 20px;border-radius:99px;transition:background .25s,gap .25s}
.fr:hover .go{background:var(--accent);gap:14px}
.fr .fi{background:var(--cbg);border-radius:22px;overflow:hidden}
.fr .fi img{display:block;width:100%;aspect-ratio:1200/860;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.fr:hover .fi img{transform:scale(1.03)}
.fr .fi{position:relative}.fr .lk{position:absolute;top:16px;right:16px;display:inline-flex;align-items:center;gap:7px;background:rgba(11,11,11,.82);color:#fff;font-size:13px;padding:8px 14px;border-radius:99px;backdrop-filter:blur(6px)}
.fr.locked .fi img{filter:saturate(.85)}
@media(max-width:820px){.fr{grid-template-columns:1fr;gap:24px;padding:40px 0}.fr .fi{order:-1}}

.next{display:block;margin-top:96px;padding:36px 0 44px;border-top:1px solid var(--fg);transition:background .25s,color .25s,padding .35s}
.next small{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
.next b{display:block;font-weight:400;font-size:clamp(32px,6vw,64px);letter-spacing:-.045em;line-height:1}
.next:hover{background:var(--accent);color:#fff;padding-left:24px;padding-right:24px}.next:hover small{color:#fffc}
footer{margin:0 0 40px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
</style><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF3B1F'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-weight='800' font-size='44' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
</head><body>
<div id="cur-dot"></div>
<header class="top"><div class="wrap"><div class="l"><span class="dot"></span><a data-go="Work" href="index.html#work">Baladharshan</a><span style="color:var(--muted);margin-left:6px" id="cur"></span></div><div class="r"><a data-go="Work" href="index.html#work">← All work</a></div></div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow" id="eb"></div>
    <div data-drift="-0.08" data-fade="1"><h1 id="h"></h1></div>
    <p class="sum rv" id="sum"></p>
  </section>
  <div class="grid"><div class="lab rv"><i>01</i>Impact</div><div class="ims" id="im"></div></div>
  <div class="grid"><div class="lab rv"><i>02</i>What I did</div><ol class="did" id="did"></ol></div>
  <section class="sel" id="pjs"><div class="sel-h">Projects · open one to see how it was made</div><div id="pl"></div></section>
  <a class="next" id="next"></a>
  <footer><span>© 2026 Baladharshan</span><a id="mail"></a></footer>
</main>
<script src="content.js"></script><script src="projects.js"></script><script src="shared.js"></script><script src="pixel-portrait.js"></script>
<script>
const P=PF,$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
pageWipe();
const list=P.work.filter(w=>w.detail),slug=new URLSearchParams(location.search).get('c');
let idx=list.findIndex(w=>w.detail.slug===slug);if(idx<0)idx=0;const w=list[idx],d=w.detail,o=list[(idx+1)%list.length];
document.title=w.co+' — Baladharshan';
$('eb').innerHTML=`<b>${w.role}</b> · ${w.when}`;
$('h').innerHTML=`<span class="ln"><span>${w.co}</span></span>`;$('h').setAttribute('aria-label',w.co);
$('sum').textContent=d.summary;
$('cur').textContent=' / '+w.co;
$('im').innerHTML=d.impact.map(i=>`<div class="im rv"><b data-c>${i.n}</b><span>${i.l}${i.est?' <em>est.</em>':''}</span></div>`).join('');
$('did').innerHTML=d.did.map((t,i)=>`<li class="rv"><i>${pad(i+1)}</i>${t}</li>`).join('');
const LOCKED=['conditional-access','protect'];
const LOCK='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
$('pl').innerHTML=PJ.filter(x=>x.co===d.slug).map(x=>{const lk=LOCKED.includes(x.slug);return `<a class="fr rv${lk?' locked':''}" ${lk?'href="index.html#deck"':`data-go="${x.name}" href="project-swiss.html?p=${x.slug}"`}><div class="t"><small>${x.area}</small><h3>${x.name}</h3><p>${x.line}</p><div class="m"><b>${x.metric}</b>${x.metricL}</div><span class="go">${lk?LOCK+' Case study on a call <i style="font-style:normal">→</i>':'Explore the project <i style="font-style:normal">→</i>'}</span></div><div class="fi" style="--cbg:${x.bg}"><img src="thumbs/cards/${x.slug}.jpg" alt="${x.name}" loading="lazy">${lk?`<span class="lk">${LOCK} Locked</span>`:''}</div></a>`}).join('');
$('next').innerHTML=`<small>Next</small><b>${o.co} →</b>`;$('next').href='company-swiss.html?c='+o.detail.slug;$('next').dataset.go=o.co;
if(list.length<2)$('next').remove();
$('mail').textContent=P.email;$('mail').href='mailto:'+P.email;
progress();drift();countUps('[data-c]');reveal();
const dot=$('cur-dot');let mx=0,my=0,dx=0,dy=0;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
(function loop(){dx+=(mx-dx)*.22;dy+=(my-dy)*.22;dot.style.transform='translate('+dx+'px,'+dy+'px)';requestAnimationFrame(loop)})();
document.addEventListener('mouseover',e=>dot.classList.toggle('big',!!e.target.closest('a.next,.fr')));
palette([{l:'All work',h:'←',go:()=>location.href='index.html#work'}].concat(list.map(x=>({l:x.co,h:'→',go:()=>location.href='company-swiss.html?c='+x.detail.slug}))));
</script></body></html>
