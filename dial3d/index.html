<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotary dial — 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fg:#0B0B0B;--muted:#6B6B6B;--line:#E4E4E4;--accent:#FF3B1F}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--fg);background:#fff;min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:min(92vw,760px);display:grid;gap:18px;justify-items:center}
#stage{width:min(86vw,76vh,720px);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(86vw,720px);flex-wrap:wrap}
#dialnum{display:flex;gap:8px;min-height:52px}
#dialnum span{min-width:42px;height:52px;border:1px solid var(--fg);display:grid;place-items:center;font-size:24px;font-weight:500;letter-spacing:-.02em}
.hint{font-size:13px;color:var(--muted)}
button{font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:99px;padding:8px 14px;color:var(--fg);cursor:pointer;transition:border-color .2s,background .2s,color .2s}
button:hover{border-color:var(--fg)}button[aria-pressed=true]{background:var(--fg);color:#fff;border-color:var(--fg)}
.row{display:flex;gap:8px}
#dbg{font:11px ui-monospace,Menlo,monospace;color:var(--muted);min-height:14px}
</style></head><body>
<div class="wrap">
  <div id="stage" role="img" aria-label="Rotary telephone dial. Press a number key, or pull a hole round to the finger stop and let go."></div>
  <div class="bar"><div id="dialnum" aria-live="polite"></div>
    <div class="row"><button id="dmute" aria-pressed="false">Sound on</button><button id="dclear">Clear</button></div></div>
  <p class="hint">Pull a number round to the finger stop, then let go. Or press 0–9.</p>
  <div id="dbg"></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="dial3d.js"></script>
</body></html>
