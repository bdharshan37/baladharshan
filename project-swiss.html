<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baladharshan — Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
:root{--bg:#FFFFFF;--fg:#0B0B0B;--muted:#6B6B6B;--line:#E4E4E4;--accent:#FF3B1F;--accent-ink:#fff;--ui:'Inter',system-ui,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,monospace;--wipe-bg:#FF3B1F;--wipe-fg:#fff;--wipe-font:400 clamp(40px,9vw,120px)/1 'Inter',sans-serif}
::selection{background:var(--accent);color:#fff}
body{overflow-x:hidden}
@media(hover:hover){body,a,button,input,[data-lb]{cursor:none}}
#cur-dot{position:fixed;left:0;top:0;width:10px;height:10px;border-radius:50%;background:var(--accent);pointer-events:none;z-index:95;transition:width .2s,height .2s,opacity .2s;margin:-5px 0 0 -5px}
#cur-dot.big{width:56px;height:56px;margin:-28px 0 0 -28px;opacity:.9}
@media(hover:none){#cur-dot{display:none}}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.top{position:sticky;top:0;z-index:20;background:var(--bg)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:14px}
.top .l{display:flex;align-items:center}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:10px}
.top a:hover{color:var(--accent)}.top .r{color:var(--muted);font-size:13px}
.hero{padding:64px 0 0}
.eyebrow{font-size:14px;color:var(--muted);margin-bottom:18px}.eyebrow b{font-weight:500;color:var(--fg)}
h1{font-weight:500;font-size:clamp(34px,6vw,64px);line-height:1.02;letter-spacing:-.045em;max-width:18ch}
.lead{margin-top:22px;max-width:52ch;font-size:clamp(17px,1.8vw,20px);line-height:1.55;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:0;margin-top:36px;border-top:1px solid var(--line)}
.facts>div{padding:16px 28px 16px 0;margin-right:28px;font-size:14px}.facts small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.cover{margin-top:40px;border-radius:18px;overflow:hidden;background:var(--cbg)}
.cover img{display:block;width:100%;aspect-ratio:1200/860;object-fit:cover}
.sec{margin-top:104px}
.sec>h2{font-weight:500;font-size:clamp(24px,3.2vw,34px);letter-spacing:-.035em;margin-bottom:8px}
.sec>.sub{color:var(--muted);font-size:15px;max-width:56ch;margin-bottom:32px}
/* overview */
.ov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ov>div{background:var(--bg);padding:26px 24px 30px}.ov small{display:block;font:12px var(--mono);color:var(--accent);margin-bottom:12px}
.ov p{font-size:15px;line-height:1.6}
/* method */
.mt{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));border-top:1px solid var(--fg)}
.mt>div{padding:18px 18px 28px 0;margin-right:18px;border-right:1px solid var(--line);min-height:300px;display:flex;flex-direction:column}
.mt>div:last-child{border-right:0;margin-right:0}
.mt .n{font:12px var(--mono);color:var(--muted)}
.mt .ic{margin:30px 0 30px;width:56px;height:56px}
.mt .ic svg{width:100%;height:100%;overflow:visible}
.mt .ic *{fill:none;stroke:var(--fg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len,160);stroke-dashoffset:var(--len,160);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1) var(--d,0s),fill .5s .6s}
.mt .ic .f{stroke:var(--accent)}
.mt>div.in .ic *{stroke-dashoffset:0}.mt>div.in .ic .fill{fill:var(--accent);stroke:var(--accent)}
.mt h3{font-weight:500;font-size:17px;letter-spacing:-.02em;margin:26px 0 8px;line-height:1.2}
.mt p{font-size:13.5px;line-height:1.55;color:var(--muted)}
@media(max-width:860px){.mt{grid-template-columns:1fr 1fr}.mt>div{min-height:0;border-right:0;margin-right:12px;border-bottom:1px solid var(--line)}}
@media(max-width:520px){.mt{grid-template-columns:1fr}}
/* explore the experience */
.ex{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:40px;padding:56px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:1px solid var(--fg)}
.ex .tx{position:sticky;top:84px;align-self:start}
.ex .k{font:12px var(--mono);color:var(--accent);margin-bottom:14px}
.ex h3{font-weight:500;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.035em;line-height:1.12;margin-bottom:22px}
.ex dl{display:grid;gap:16px}.ex dt{font-size:14px;font-weight:500;margin-bottom:3px}.ex dd{font-size:14px;line-height:1.6;color:var(--muted)}
.ex .call{margin-top:26px;padding-left:16px;border-left:2px solid var(--accent);font-size:15px;line-height:1.5}
.ex .pn{background:var(--cbg);border-radius:16px;padding:clamp(14px,3vw,30px);position:relative}
.ex .big{display:block;width:100%;border-radius:10px;box-shadow:0 18px 50px rgba(20,30,50,.16),0 0 0 1px rgba(0,0,0,.06);background:#fff;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ex .pn:hover .big{transform:scale(1.01)}
.ex .ph-row{display:flex;gap:14px;justify-content:center;align-items:flex-start}
.ex .ph-row img{flex:1 1 0;min-width:0;max-width:200px;border-radius:22px;box-shadow:0 18px 50px rgba(20,30,50,.18),0 0 0 1px rgba(0,0,0,.06);background:#fff}
.ex .cap{font-size:12.5px;color:var(--muted);margin-top:14px;min-height:34px}
.ex .th{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ex .th button{width:56px;height:40px;border:1.5px solid transparent;border-radius:6px;overflow:hidden;padding:0;background:#fff;opacity:.6;transition:opacity .2s,border-color .2s}
.ex .th button.on,.ex .th button:hover{opacity:1;border-color:var(--fg)}
.ex .th img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:820px){.ex{grid-template-columns:1fr}.ex .tx{position:static}}
@media(max-width:560px){.ex .ph-row{overflow-x:auto;justify-content:flex-start;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px}.ex .ph-row img{flex:0 0 62%;max-width:230px;scroll-snap-align:start}}
/* outcome + next */
.out{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:end;padding-top:28px}
.out b{display:block;font-weight:500;font-size:clamp(44px,7vw,84px);letter-spacing:-.05em;line-height:1;color:var(--accent)}
.out span{display:block;margin-top:10px;font-size:15px;color:var(--muted);max-width:30ch}
.out p{font-size:clamp(17px,2vw,22px);line-height:1.45;letter-spacing:-.015em}
@media(max-width:720px){.out{grid-template-columns:1fr}}
.next{display:block;margin-top:104px;padding:36px 0 44px;border-top:1px solid var(--fg);transition:background .25s,color .25s,padding .35s}
.next small{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
.next b{display:block;font-weight:500;font-size:clamp(30px,5.4vw,60px);letter-spacing:-.045em;line-height:1.05}
.next:hover{background:var(--accent);color:#fff;padding-left:24px;padding-right:24px}.next:hover small{color:#fffc}
footer{margin:0 0 40px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
@media(max-width:720px){.ov{grid-template-columns:1fr}}
</style><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF3B1F'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-weight='800' font-size='44' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
</head><body>
<div id="cur-dot"></div>
<header class="top"><div class="wrap"><div class="l"><span class="dot"></span><a data-go="Work" href="index.html#work">Baladharshan</a><span style="color:var(--muted);margin-left:6px" id="cur"></span></div><div class="r"><a data-go="Work" href="index.html#work">← All work</a></div></div></header>
<main class="wrap">
  <section class="hero"><div class="eyebrow" id="eb"></div><h1 id="h"></h1><p class="lead" id="lead"></p><div class="facts" id="facts"></div>
    <div class="cover" id="cover"><img id="coverimg" alt=""></div></section>
  <section class="sec"><div class="ov" id="ov"></div></section>
  <section class="sec"><h2>How I worked</h2><p class="sub">The way of working that fit this project, in the order it happened.</p><div class="mt" id="mt"></div></section>
  <section class="sec"><h2>Explore the experience</h2><p class="sub" id="exsub"></p><div id="exs"></div></section>
  <section class="sec"><div class="out" id="out"></div></section>
  <a class="next" id="next"></a>
  <footer><span>© 2026 Baladharshan</span><a id="mail"></a></footer>
</main>
<script src="content.js"></script><script src="projects.js"></script><script src="shared.js"></script>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),CO={jumpcloud:'JumpCloud',microsoft:'Microsoft'};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
/* abstract method icons: line glyphs that draw themselves in as they scroll into view */
const IC={
 spark:'<path class="fill" d="M24 4l4 16 16 4-16 4-4 16-4-16L4 24l16-4z"/>',
 ear:'<path d="M8 24v0M16 14v20M24 6v36M32 14v20M40 22v4"/>',
 grid:'<rect x="6" y="6" width="15" height="15" rx="3"/><rect x="27" y="6" width="15" height="15" rx="3" class="f"/><rect x="6" y="27" width="15" height="15" rx="3" class="f"/><rect x="27" y="27" width="15" height="15" rx="3"/>',
 bolt:'<path class="fill" d="M27 4L9 27h13l-3 17 19-25H25z"/>',
 lock:'<rect x="8" y="21" width="32" height="22" rx="5"/><path d="M15 21v-6a9 9 0 0 1 18 0v6"/><circle class="f" cx="24" cy="32" r="3"/>',
 clock:'<circle cx="24" cy="24" r="19"/><path class="f" d="M24 12v13l9 6"/>',
 chat:'<path d="M6 10a5 5 0 0 1 5-5h26a5 5 0 0 1 5 5v18a5 5 0 0 1-5 5H20l-10 9v-9h-1a5 5 0 0 1-3-5z"/><path class="f" d="M15 16h18M15 24h11"/>',
 layers:'<path d="M24 5l19 10-19 10L5 15z"/><path class="f" d="M5 24l19 10 19-10"/><path d="M5 33l19 10 19-10"/>',
 loop:'<path d="M38 18a15 15 0 0 0-27-4"/><path class="f" d="M10 30a15 15 0 0 0 27 4"/><path d="M37 6v9h-9M11 42v-9h9"/>',
 pen:'<path d="M31 8l9 9-22 22-11 2 2-11z"/><path class="f" d="M26 13l9 9"/>',
 key:'<circle cx="15" cy="24" r="9"/><path class="f" d="M24 24h19M36 24v8M42 24v6"/>',
 target:'<circle cx="24" cy="24" r="19"/><circle cx="24" cy="24" r="10"/><circle class="fill" cx="24" cy="24" r="3"/>',
 nodes:'<circle cx="10" cy="24" r="5"/><circle cx="38" cy="10" r="5" class="f"/><circle cx="38" cy="38" r="5"/><path d="M15 23l18-11M15 25l18 11"/>',
 check:'<circle cx="24" cy="24" r="19"/><path class="f" d="M14 25l7 7 14-15"/>',
 phone:'<rect x="12" y="4" width="24" height="40" rx="6"/><path class="f" d="M20 10h8M21 38h6"/>',
 bell:'<path d="M12 33V21a12 12 0 0 1 24 0v12l4 5H8z"/><path class="f" d="M20 43a4 4 0 0 0 8 0"/>',
 shield:'<path d="M24 4l16 6v12c0 11-7 18-16 22C15 40 8 33 8 22V10z"/><path class="f" d="M16 23l6 6 11-12"/>',
 question:'<circle cx="24" cy="24" r="19"/><path class="f" d="M18 19a6 6 0 1 1 9 5c-2 1-3 2-3 5"/><circle class="fill" cx="24" cy="35" r="1.6"/>',
 eye:'<path d="M3 24C9 13 16 8 24 8s15 5 21 16c-6 11-13 16-21 16S9 35 3 24z"/><circle class="f" cx="24" cy="24" r="6"/>',
 branch:'<circle cx="12" cy="9" r="4"/><circle cx="12" cy="39" r="4"/><circle cx="36" cy="18" r="4" class="f"/><path d="M12 13v22M12 30c0-8 24-2 24-8"/>',
 users:'<circle cx="17" cy="16" r="7"/><path d="M4 41a13 13 0 0 1 26 0"/><circle class="f" cx="34" cy="19" r="5"/><path class="f" d="M34 31a10 10 0 0 1 11 10"/>'
};
const icon=(k,i)=>`<svg viewBox="0 0 48 48" aria-hidden="true">${(IC[k]||IC.spark).replace(/<(path|rect|circle)/g,(m)=>m+` pathLength="160" style="--d:${i*.08}s"`)}</svg>`;

const slug=new URLSearchParams(location.search).get('p');let idx=PJ.findIndex(p=>p.slug===slug);if(idx<0)idx=0;
const p=PJ[idx],nx=PJ[(idx+1)%PJ.length],coName=CO[p.co]||p.co;
document.title=p.name+' — Baladharshan';pageWipe();
document.documentElement.style.setProperty('--cbg',p.bg);
$('cur').textContent=' / '+coName+' / '+p.name;
$('eb').innerHTML=`<b>${coName}</b> · ${esc(p.area)}`;$('h').textContent=p.name;$('lead').textContent=p.line;
$('facts').innerHTML=[['My role',p.role],['From → to',p.frm+' → '+p.to]].concat(p.facts||[]).map(f=>`<div><small>${esc(f[0])}</small>${esc(f[1])}</div>`).join('');
$('coverimg').src='thumbs/cards/'+p.slug+'.jpg';$('coverimg').alt=p.name;
$('ov').innerHTML=[['The problem',p.prob],['What I did',p.did],['Where it landed',p.out||p.line]].map((o,i)=>`<div class="rv"><small>0${i+1} · ${o[0]}</small><p>${esc(o[1])}</p></div>`).join('');
$('mt').style.setProperty('--n',p.method.length);
$('mt').innerHTML=p.method.map((m,i)=>`<div class="rv"><span class="n">${pad(i+1)}</span><div class="ic">${icon(m.i,i)}</div><h3>${esc(m.t)}</h3><p>${esc(m.d)}</p></div>`).join('');
$('exsub').textContent=p.intro;
$('exs').innerHTML=p.ch.map((c,ci)=>{
  const phones=c.imgs.length&&c.imgs.every(x=>x.phone);
  const panel=phones
    ?`<div class="ph-row">${c.imgs.map(x=>`<img class="ex-big" src="${x.src}" data-src="${x.src}" data-cap="${esc(c.k+' — '+x.cap)}" alt="${esc(x.cap)}" loading="lazy">`).join('')}</div><div class="cap">${esc(c.imgs[0].cap)}</div>`
    :c.imgs.length?`<img class="big ex-big" src="${c.imgs[0].src}" data-src="${c.imgs[0].src}" data-cap="${esc(c.k+' — '+c.imgs[0].cap)}" alt="${esc(c.imgs[0].cap)}"><div class="cap">${esc(c.imgs[0].cap)}</div>`
      +(c.imgs.length>1?`<div class="th">${c.imgs.map((x,xi)=>`<button type="button" class="${xi?'':'on'}" data-i="${xi}" aria-label="Screen ${xi+1}"><img src="${x.src}" alt=""></button>`).join('')}</div>`:''):'';
  return `<div class="ex rv" data-c="${ci}"><div class="tx"><div class="k">${pad(ci+1)} · ${esc(c.k)}</div><h3>${esc(c.h)}</h3><dl>${c.blocks.map(b=>`<div><dt>${esc(b.t)}</dt><dd>${esc(b.d)}</dd></div>`).join('')}</dl>${c.call?`<p class="call">${esc(c.call)}</p>`:''}</div><div class="pn">${panel}</div></div>`}).join('');
document.querySelectorAll('.ex .th').forEach(t=>{const ex=t.closest('.ex'),c=p.ch[+ex.dataset.c],big=ex.querySelector('.big'),cap=ex.querySelector('.cap');
  t.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const x=c.imgs[+b.dataset.i];big.src=x.src;big.dataset.src=x.src;big.dataset.cap=c.k+' — '+x.cap;big.alt=x.cap;cap.textContent=x.cap;t.querySelectorAll('button').forEach(o=>o.classList.toggle('on',o===b))})});
$('out').innerHTML=`<div><b>${esc(p.metric)}</b><span>${esc(p.metricL)}</span></div><p>${esc(p.out||p.line)}</p>`;
$('next').innerHTML=`<small>Next project</small><b>${esc(nx.name)} →</b>`;$('next').href='project-swiss.html?p='+nx.slug;$('next').dataset.go=nx.name;
$('mail').textContent=PF.email;$('mail').href='mailto:'+PF.email;
/* method cells draw in when they reach the viewport */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.35});
document.querySelectorAll('.mt>div').forEach(d=>io.observe(d));
lightbox('.ex-big');progress();reveal();
const dot=$('cur-dot');let mx=0,my=0,dx=0,dy=0;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
(function loop(){dx+=(mx-dx)*.22;dy+=(my-dy)*.22;dot.style.transform='translate('+dx+'px,'+dy+'px)';requestAnimationFrame(loop)})();
document.addEventListener('mouseover',e=>dot.classList.toggle('big',!!e.target.closest('a.next,.ex-big')));
palette([{l:'All work',h:'←',go:()=>location.href='index.html#work'}].concat(PJ.map(x=>({l:x.name,h:'→',go:()=>location.href='project-swiss.html?p='+x.slug}))));
</script></body></html>
